[project]
name = "orchestration"
version = "0.1.0"
description = "Phase 6 FastAPI orchestration service: sessions, turns, gate precedence, leases, idempotent flows."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13",
    "fastapi>=0.115",
    "uvicorn>=0.31",
    "asyncpg>=0.30",
    "review-schemas",
    "google-cloud-storage>=2.14",
]

[tool.hatch.build.targets.wheel]
packages = ["orchestration"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
