[project]
name = "mcp-ingress"
version = "0.1.0"
description = "Shared ID-token ingress middleware and caller-principal contextvar for the MCP servers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-auth>=2.40",
    "requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_ingress"]
