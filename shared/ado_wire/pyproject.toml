[project]
name = "ado-wire"
version = "0.1.0"
description = "Shared Pydantic v2 wire models for verbatim Azure DevOps work-item and comment payloads."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ado_wire"]
