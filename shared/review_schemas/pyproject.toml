[project]
name = "review-schemas"
version = "0.5.0"
description = "Shared Pydantic v2 contract models for the story-review capstone (HTTP, agents, MCP, persistence)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["review_schemas"]
