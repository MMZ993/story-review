[project]
name = "agent-kit"
version = "0.1.0"
description = "Shared agent support: fail-loud PROMPTS_DIR prompt loading with SHA-256 and immutable per-agent model config."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "google-adk==2.8.0",
    "review-schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_kit"]
