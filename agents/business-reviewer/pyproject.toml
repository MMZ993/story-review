[project]
name = "business-reviewer-agent"
version = "0.1.0"
description = "Phase 5 Business perspective reviewer agent (ADK)."
requires-python = ">=3.12"
dependencies = [
    "google-adk==2.8.0",
    "agent-kit",
    "review-schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["business_reviewer"]

[tool.hatch.build.targets.wheel.force-include]
"config.yaml" = "business_reviewer/config.yaml"
