[project]
name = "synthesis-agent"
version = "0.1.0"
description = "Phase 5 Synthesis and conflict resolver agent (ADK)."
requires-python = ">=3.12"
dependencies = [
    "google-adk==2.8.0",
    "agent-kit",
    "review-schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synthesis"]
