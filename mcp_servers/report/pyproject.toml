[project]
name = "report-mcp"
version = "0.1.0"
description = "Phase 4 report MCP server: deterministic MD/PDF rendering of a run's finalized review (render_report, orchestration-only)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13",
    "mcp[cli]>=2.1",
    "review-schemas",
    "mcp-ingress",
    "google-cloud-storage>=2.14",
    "fpdf2>=2.8",
    "uvicorn>=0.31",
]

[tool.hatch.build.targets.wheel]
packages = ["report_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
