[project]
name = "story-mcp"
version = "0.2.0"
description = "Phase 4 story MCP server: dual-source preparation (mock dataset / live Azure DevOps) + list_stories/get_story tools."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13",
    "mcp[cli]>=2.1",
    "review-schemas",
    "dataset-loader",
    "ado-wire",
]

[tool.hatch.build.targets.wheel]
packages = ["story_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
