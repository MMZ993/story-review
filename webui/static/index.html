<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>story-review</title>
    <link rel="stylesheet" href="/app.css" />
    <script type="importmap">
      {
        "imports": {
          "dompurify": "/vendor/dompurify.esm.js",
          "marked": "/vendor/marked.esm.js",
          "remend": "/vendor/remend.esm.js"
        }
      }
    </script>
    <script type="module" src="/app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="site-header">
        <h1>story-review</h1>
        <p id="orchestration-status" role="status">checking orchestration…</p>
      </header>

      <!-- Story picker (increment 1) -->
      <section id="picker-view" class="view" aria-label="Story picker">
        <div class="picker-header">
          <h2>choose a story</h2>
          <button id="confirm-story" type="button">start review session</button>
          <p id="picker-status" role="status"></p>
        </div>
        <details id="open-sessions" class="open-sessions" open>
          <summary id="open-sessions-summary">open sessions (0)</summary>
          <ul id="open-sessions-list" class="open-sessions-list"></ul>
        </details>
        <details id="past-sessions" class="past-sessions" open>
          <summary id="past-sessions-summary">past sessions (0)</summary>
          <ul id="past-sessions-list" class="past-sessions-list"></ul>
        </details>
        <details id="story-picker" class="story-picker" open>
          <summary id="story-summary">stories (0)</summary>
          <input id="story-filter" type="search" placeholder="filter stories…" aria-label="Filter stories by title" />
          <ul id="story-list" class="story-list"></ul>
        </details>
        <div id="story-preview" class="story-preview" aria-live="polite">hover a story to preview it</div>
      </section>

      <!-- Session chat view (increment 2) -->
      <section id="session-view" class="view" aria-label="Session" hidden>
        <p id="session-header" class="session-header"></p>
        <ol id="messages" class="messages"></ol>
        <form id="composer" class="composer">
          <textarea id="turn-input" rows="2" placeholder="message to the reviewers…"></textarea>
          <button id="send-turn" type="submit">send</button>
        </form>
        <div id="session-actions">
          <button id="accept-turn" type="button" hidden>accept &amp; finalize</button>
        </div>
        <div id="report-links" class="report-links"></div>
        <div id="status" role="status"></div>
      </section>

      <footer class="site-footer">@ 2026 Marcin Żak / <a href="https://mmz.sh/">mmz.sh</a></footer>
    </main>
  </body>
</html>
