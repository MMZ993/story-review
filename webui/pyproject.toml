[project]
name = "webui"
version = "0.1.0"
description = "Phase 7 minimal web client: static chat UI served by a small FastAPI app with a thin /api reverse proxy to orchestration."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13",
    "fastapi>=0.115",
    "uvicorn>=0.31",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["webui"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
