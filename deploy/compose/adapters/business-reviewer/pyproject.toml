[project]
name = "business-reviewer-adapter"
version = "0.1.0"
description = "Local compose adapter: business-reviewer ADK agent behind the frozen single-turn invocation interface."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "google-adk==2.8.0",
    "agent-kit",
    "review-schemas",
    "business-reviewer-agent",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["business_reviewer_adapter"]
