[project]
name = "engineering-reviewer-adapter"
version = "0.1.0"
description = "Local compose adapter: engineering-reviewer ADK agent behind the frozen single-turn invocation interface."
requires-python = ">=3.12"
dependencies = [
    "agent-kit",
    "review-schemas",
    "engineering-reviewer-agent",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engineering_reviewer_adapter"]
