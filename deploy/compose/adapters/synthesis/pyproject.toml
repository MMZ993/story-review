[project]
name = "synthesis-adapter"
version = "0.1.0"
description = "Local compose adapter: synthesis ADK agent behind the frozen single-turn invocation interface."
requires-python = ">=3.12"
dependencies = [
    "agent-kit",
    "review-schemas",
    "synthesis-agent",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synthesis_adapter"]
