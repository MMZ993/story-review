# Local development stack (Phase 4 increment 4, `local` profile).
#
# Three MCP services (story, artifact, report) built from the repository-root
# Dockerfiles, plus a fake-gcs-server substitute for GCS — per
# docs/operations/repository-layout.md "Local compose". Service-account
# ingress checks are disabled ONLY here via the *_AUTH_DISABLED env vars;
# no other profile or deployment shape may set them.
#
# Substitutes (design docs): GCS -> fsouza/fake-gcs-server (buckets
# pre-created by gcs-init before the servers start, because both the
# artifact and report servers validate the bucket at startup); the mock
# story dataset is bind-mounted read-only, never baked into any image.
#
# Usage (short commands; long logic lives in the Makefile):
#   make compose-up      # build + start this profile
#   make compose-down    # stop and remove
#
# Ports and the bucket name are configurable via deploy/env/.env.

name: story-review

services:
  fake-gcs:
    image: fsouza/fake-gcs-server:latest
    # Dual scheme (increment 4 / D15-5): HTTP for the internal artifact
    # and report servers (http://fake-gcs:8000) and host-side contract
    # tests (127.0.0.1:9025); HTTPS for orchestration's signed report
    # download URLs (self-signed — the ReportDownload HttpsUrl shape
    # requires https; downloaders relax verification locally).
    command: -scheme both -backend memory -public-host 127.0.0.1:${FAKE_GCS_HTTPS_PORT:-9026}
    ports:
      - "127.0.0.1:${FAKE_GCS_PORT:-9025}:8000"
      - "127.0.0.1:${FAKE_GCS_HTTPS_PORT:-9026}:4443"
    profiles: ["local"]

  gcs-init:
    # Creates the shared artifact bucket before the servers start; the
    # servers then connect to http://fake-gcs:8000 inside the compose
    # network (never through the host ports).
    image: python:3.13-slim
    depends_on:
      - fake-gcs
    environment:
      ARTIFACT_BUCKET: ${ARTIFACT_BUCKET:-artifacts-local}
    entrypoint:
      - python
      - -c
      - |
        import os, time, urllib.request, urllib.error
        bucket = os.environ["ARTIFACT_BUCKET"]
        url = f"http://fake-gcs:8000/storage/v1/b?project=local"
        body = f'{{"name": "{bucket}"}}'.encode()
        for _ in range(60):
            try:
                req = urllib.request.Request(
                    url, data=body, headers={"Content-Type": "application/json"})
                with urllib.request.urlopen(req, timeout=2) as resp:
                    print("bucket created:", resp.status)
                    break
            except urllib.error.HTTPError as e:
                if e.code == 409:  # already exists from a previous run
                    print("bucket already present")
                    break
                raise
            except (urllib.error.URLError, OSError):
                time.sleep(0.5)  # fake-gcs not ready yet
        else:
            raise SystemExit("fake-gcs-server not ready")
    profiles: ["local"]

  story:
    build:
      context: ..
      dockerfile: mcp_servers/story/Dockerfile
    # No gcs-init dependency: the mock source reads the mounted directory
    # and never touches GCS.
    environment:
      # In-network service URLs: with these unset the MCP SDK's DNS-rebinding
      # protection defaults to host 127.0.0.1 and rejects in-network Host
      # headers (421) — Runbook 13 increment-0 gotcha. Auth stays disabled, so
      # the audience value is unused locally.
      STORY_SERVICE_URL: http://story:8080
      STORY_SOURCE: mock
      STORY_DATASET_LOCATION: /app/dataset-stories
      STORY_AUTH_DISABLED: "1"
    volumes:
      # Mock dataset bind-mounted read-only; images stay dataset-agnostic.
      - ../dataset/stories:/app/dataset-stories:ro
    ports:
      - "127.0.0.1:${STORY_PORT:-8101}:8080"
    profiles: ["local"]

  artifact:
    build:
      context: ..
      dockerfile: mcp_servers/artifact/Dockerfile
    depends_on:
      gcs-init:
        condition: service_completed_successfully
    environment:
      ARTIFACT_SERVICE_URL: http://artifact:8080
      ARTIFACT_BUCKET: ${ARTIFACT_BUCKET:-artifacts-local}
      ARTIFACT_GCS_ENDPOINT: http://fake-gcs:8000
      ARTIFACT_AUTH_DISABLED: "1"
    ports:
      - "127.0.0.1:${ARTIFACT_PORT:-8102}:8080"
    profiles: ["local"]

  report:
    build:
      context: ..
      dockerfile: mcp_servers/report/Dockerfile
    depends_on:
      gcs-init:
        condition: service_completed_successfully
    environment:
      REPORT_SERVICE_URL: http://report:8080
      REPORT_BUCKET: ${ARTIFACT_BUCKET:-artifacts-local}
      REPORT_GCS_ENDPOINT: http://fake-gcs:8000
      REPORT_AUTH_DISABLED: "1"
    ports:
      - "127.0.0.1:${REPORT_PORT:-8103}:8080"
    profiles: ["local"]

  # --- Phase 7 (webui) --------------------------------------------------
  # Static chat shell + thin same-origin /api reverse proxy (D17-1
  # amendment). The proxy target is the orchestration service below; when
  # the local-agents profile is not up, /api returns 503 (page still loads).
  webui:
    build:
      context: ..
      dockerfile: webui/Dockerfile
    environment:
      ORCHESTRATION_BASE_URL: http://orchestration:8080
    ports:
      - "127.0.0.1:${WEBUI_PORT:-8120}:8080"
    profiles: ["local"]

  # --- local-agents profile (Phase 5 increment 4) ----------------------
  # Four ADK agent adapters behind the frozen invocation interfaces, plus
  # the PostgreSQL session backend for the facilitator (DatabaseSessionService;
  # runtime state only — D13-5). Vertex AI is the sole external dependency:
  # the host's gcloud ADC file is bind-mounted read-only (local-only; no SA
  # keys). The profile extends the `local` MCP stack — bring both up:
  #   make agents-compose-up

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: facilitator
      POSTGRES_PASSWORD: facilitator
      POSTGRES_DB: facilitator
    # Runtime state only (sessions); no host port needed.
    profiles: ["local-agents"]

  business-reviewer-adapter:
    # Host-uid user so the read-only ADC bind mount stays readable; the
    # image's `USER nobody` is overridden at runtime for this profile only.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    build:
      context: ..
      dockerfile: deploy/compose/adapters/Dockerfile
      args:
        SLUG: business-reviewer
    environment: &adapter-env
      GOOGLE_GENAI_USE_VERTEXAI: "true"
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-europe-west4}
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/adc/application_default_credentials.json
    volumes: &adapter-volumes
      # Local-only ADC mount (read-only); never present in any deployment.
      - ${HOME}/.config/gcloud/application_default_credentials.json:/tmp/adc/application_default_credentials.json:ro
    ports:
      - "127.0.0.1:${BUSINESS_REVIEWER_PORT:-8111}:8080"
    profiles: ["local-agents"]

  engineering-reviewer-adapter:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    build:
      context: ..
      dockerfile: deploy/compose/adapters/Dockerfile
      args:
        SLUG: engineering-reviewer
    environment: *adapter-env
    volumes: *adapter-volumes
    ports:
      - "127.0.0.1:${ENGINEERING_REVIEWER_PORT:-8112}:8080"
    profiles: ["local-agents"]

  synthesis-adapter:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    build:
      context: ..
      dockerfile: deploy/compose/adapters/Dockerfile
      args:
        SLUG: synthesis
    environment: *adapter-env
    volumes: *adapter-volumes
    ports:
      - "127.0.0.1:${SYNTHESIS_PORT:-8113}:8080"
    profiles: ["local-agents"]

  facilitator-adapter:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    build:
      context: ..
      dockerfile: deploy/compose/adapters/Dockerfile
      args:
        SLUG: facilitator
    depends_on:
      - story
      - artifact
      - postgres
    environment:
      <<: *adapter-env
      FACILITATOR_STORY_URL: http://story:8080/mcp
      FACILITATOR_ARTIFACT_URL: http://artifact:8080/mcp
      FACILITATOR_DB_URL: postgresql+asyncpg://facilitator:facilitator@postgres:5432/facilitator
    volumes: *adapter-volumes
    ports:
      - "127.0.0.1:${FACILITATOR_PORT:-8114}:8080"
    profiles: ["local-agents"]

  # --- Phase 6/7 (orchestration, browser-gate target) -------------------
  # Orchestration runs as a compose service so the webui proxy (and the
  # browser behind it) reaches a real endpoint. State lives in the compose
  # postgres (migrations applied via deploy/cloud-sql/run-migrations.sh
  # against the published host port before first use). Same shape as the
  # in-process Phase 6 test runs, plus ADC for the fake-gcs signing path.
  orchestration:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    build:
      context: ..
      dockerfile: orchestration/Dockerfile
    depends_on:
      - story
      - artifact
      - report
      - postgres
      - business-reviewer-adapter
      - engineering-reviewer-adapter
      - synthesis-adapter
      - facilitator-adapter
    environment:
      <<: *adapter-env
      # Separate database in the shared compose postgres: the facilitator's
      # ADK DatabaseSessionService owns its own `sessions` table in the
      # default DB (migration 0001 clashes there — Runbook 13 gotcha).
      ORCH_DB_DSN: postgres://facilitator:facilitator@postgres:5432/orchestration
      ORCH_STORY_URL: http://story:8080/mcp
      ORCH_ARTIFACT_URL: http://artifact:8080/mcp
      ORCH_REPORT_URL: http://report:8080/mcp
      ORCH_BUCKET: ${ARTIFACT_BUCKET:-artifacts-local}
      ORCH_BUSINESS_URL: http://business-reviewer-adapter:8080
      ORCH_ENGINEERING_URL: http://engineering-reviewer-adapter:8080
      ORCH_SYNTHESIS_URL: http://synthesis-adapter:8080
      ORCH_FACILITATOR_URL: http://facilitator-adapter:8080
      ORCH_GCS_PUBLIC_URL: https://127.0.0.1:${FAKE_GCS_HTTPS_PORT:-9026}
    volumes: *adapter-volumes
    ports:
      - "127.0.0.1:${ORCHESTRATION_PORT:-8130}:8080"
    profiles: ["local-agents"]
